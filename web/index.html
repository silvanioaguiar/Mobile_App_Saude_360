<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Caminho base. O Flutter troca $FLUTTER_BASE_HREF pelo valor de --base-href.
    Na raiz do domínio: "/". No GitHub Pages: "/Mobile_App_Saude_360/".
    Precisa começar e terminar com "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Saúde360: cadastro de usuários e agenda de visitas domiciliares (dados fictícios).">

  <!-- PWA: cor da barra do navegador/sistema e manifesto -->
  <meta name="theme-color" content="#002B4B">
  <link rel="manifest" href="manifest.json">

  <!-- iOS (Safari não lê tudo do manifesto) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saúde360">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saúde360</title>

  <!-- Tela de carregamento: aparece enquanto o Flutter baixa e inicia -->
  <style>
    html, body { margin: 0; height: 100%; background: #E8F5FA; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #002B4B;
    }
    #carregando img { width: 120px; height: 120px; }
    #carregando .barra {
      width: 140px; height: 4px; background: #ffffff; border-radius: 2px; overflow: hidden;
    }
    #carregando .barra::after {
      content: ""; display: block; width: 40%; height: 100%; background: #19C65A;
      animation: corre 1.1s ease-in-out infinite;
    }
    @keyframes corre { from { margin-left: -40%; } to { margin-left: 100%; } }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="Saúde360">
    <div class="barra"></div>
  </div>
  <script>
    // Remove a tela de carregamento quando o Flutter desenhar o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
